name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test core
        run: npm run test:core

      - name: Test renderer
        run: npm run test:run

      - name: Build
        run: npm run build
